<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <h1>University Management System</h1>
    <p>Student Data & Course Information</p>
  </header>

  <!-- Form Section -->
  <section class="form-section">
    <h2>Add Student</h2>
    <form>
      <input type="text" placeholder="Student Name" required>
      <input type="text" placeholder="Roll Number" required>
      <input type="text" placeholder="Course" required>
      <button type="submit">Add Student</button>
    </form>
  </section>

  <!-- Table Section -->
  <section class="table-section">
    <h2>Student List</h2>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Roll No</th>
          <th>Course</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Rahul Sharma</td>
          <td>101</td>
          <td>M.Sc. CS</td>
        </tr>
        <tr>
          <td>Priya Patil</td>
          <td>102</td>
          <td>B.Sc. CS</td>
        </tr>
        <tr>
          <td>Amit Jadhav</td>
          <td>103</td>
          <td>B.Tech IT</td>
        </tr>
      </tbody>
    </table>
  </section>

  <!-- Footer -->
  <footer>
    <p>Made by Chandrakant Khole | M.Sc. Computer Science</p>
  </footer>

</body>
</html>
